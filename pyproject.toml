[project]
name = "alternative-fabric-manager"
version = "0.1.0"
description = "An InfiniBand fabric manager for networking-mlnx that drives OpenSM partitions"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "StackHPC" }]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13",
    "docker>=7.0",
    "fastapi>=0.115",
    "jinja2>=3.1.6",
    "pymysql>=1.1",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
alternative-fabric-manager = "alternative_fabric_manager.cli:main"
alternative-fabric-manager-watchdog = "alternative_fabric_manager.ha.watchdog:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "S607", "SIM105", "S310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
