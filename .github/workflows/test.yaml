name: Test

on:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        id: pytest
        run: uv run pytest --junitxml=pytest.xml

      - name: Publish test annotations
        if: ${{ always() && hashFiles('pytest.xml') != '' }}
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        with:
          check_name: Pytest
          report_paths: pytest.xml

  image:
    name: Image
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/image-test.yaml

  # The same unit tests against MariaDB, which runs what SQLite skips: the
  # Alembic migrations, the server-only checks such as the causal wait each
  # session sets (see specs/ha.md, Galera specifics), and REPEATABLE READ.
  test-mariadb:
    name: Test (MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: docker.io/library/mariadb:10.11
        env:
          # A throwaway server that lives as long as the job
          MARIADB_ROOT_PASSWORD: afm-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      AFM_TEST_DATABASE_URL: mysql+pymysql://root:afm-test@127.0.0.1:3306/afm_test
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest --junitxml=pytest-mariadb.xml

      - name: Publish test annotations
        if: ${{ always() && hashFiles('pytest-mariadb.xml') != '' }}
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        with:
          check_name: Pytest (MariaDB)
          report_paths: pytest-mariadb.xml
