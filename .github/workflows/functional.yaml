# The HA functional tests (see the functional-tests skill): three AFM
# instances against a three-node Galera cluster in containers, with a fake
# OpenSM under the real watchdog.
#
# - Every pull request gets a "Functional (failover)" check, which can be
#   required: it runs the failover suite if the pull request touches HA code,
#   and otherwise passes in seconds, so that a required check never waits
#   for a run that a path filter skipped.
# - nightly.yaml calls it for a longer nemesis, and release.yaml for the
#   nemesis as a gate before a version is tagged.
# - Either suite can be run by hand, with a seed to replay.
#
# A failed run uploads every test's instance logs, fabric directory and,
# for the nemesis, history.json, and its summary names the nemesis seed,
# for AFM_NEMESIS_SEED to replay the schedule.
name: Functional

on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "failover or nemesis"
        required: true
        default: failover
        type: choice
        options: [failover, nemesis]
      nemesis_seconds:
        description: "How long the nemesis injects faults"
        default: "300"
        type: string
      nemesis_seed:
        description: "A seed to replay, or empty for a random one"
        default: ""
        type: string
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      nemesis_seconds:
        default: "300"
        type: string
      nemesis_seed:
        default: ""
        type: string
      ref:
        description: "What to check out, such as main for a release"
        default: ""
        type: string
    outputs:
      seed:
        description: "The nemesis seed, to replay a failure"
        value: ${{ jobs.functional.outputs.seed }}

permissions:
  contents: read

concurrency:
  group: functional-${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite || 'failover' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  functional:
    # A stable name, for a required check
    name: Functional (${{ inputs.suite || 'failover' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      seed: ${{ steps.summary.outputs.seed }}
    env:
      SUITE: ${{ inputs.suite || 'failover' }}
      AFM_NEMESIS_SECONDS: ${{ inputs.nemesis_seconds || '300' }}
      AFM_NEMESIS_SEED: ${{ inputs.nemesis_seed }}
      # The runner's user can use Docker without sudo.
      AFM_DOCKER: docker
      AFM_FUNCTIONAL: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Decide whether to run
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Only a pull request may skip: one that doesn't touch HA code, the
          # schema, the API or the harness.
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          pattern='^(alternative_fabric_manager/(ha/|drivers/|migrations/|manager\.py|db\.py|api\.py)|tests/functional/|\.github/workflows/functional\.yaml|pyproject\.toml|uv\.lock)'
          if git diff --name-only "$BASE" HEAD | grep -qE "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No HA code changed: nothing to run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up uv
        if: steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - name: Install locked dependencies
        if: steps.scope.outputs.run == 'true'
        run: uv sync --locked

      - name: Pull MariaDB's image
        if: steps.scope.outputs.run == 'true'
        run: docker pull docker.io/library/mariadb:10.11

      - name: Run the failover suite
        if: steps.scope.outputs.run == 'true' && env.SUITE == 'failover'
        run: >-
          uv run pytest -q tests/functional/test_failover.py
          --basetemp="$RUNNER_TEMP/functional"

      - name: Run the nemesis
        if: steps.scope.outputs.run == 'true' && env.SUITE == 'nemesis'
        env:
          AFM_NEMESIS: "1"
        run: |
          set -o pipefail
          uv run pytest -q -s tests/functional/test_nemesis.py \
            --basetemp="$RUNNER_TEMP/functional" | tee "$RUNNER_TEMP/nemesis.txt"

      - name: Summarise the nemesis
        id: summary
        if: always() && steps.scope.outputs.run == 'true' && env.SUITE == 'nemesis'
        run: |
          seed="$(grep -oE 'AFM_NEMESIS_SEED=[0-9]+' "$RUNNER_TEMP/nemesis.txt" \
            | head -1 | cut -d= -f2 || true)"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          {
            echo "## Nemesis"
            echo
            grep -E "AFM_NEMESIS_SEED=|faults,|NOTE:" "$RUNNER_TEMP/nemesis.txt" \
              | sed 's/^/    /' || echo "No summary: see the log."
            echo
            echo "Replay with \`AFM_NEMESIS_SEED=$seed\`, by hand or with this"
            echo "workflow's nemesis_seed input."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: functional-${{ env.SUITE }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/functional
            ${{ runner.temp }}/nemesis.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Remove the Galera containers
        if: always() && steps.scope.outputs.run == 'true'
        run: docker rm -f afm-galera-1 afm-galera-2 afm-galera-3 || true
